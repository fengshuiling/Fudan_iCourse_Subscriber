name: iCourse Check (migrated to CircleCI)

# Keep the old manual entry discoverable, without a second scheduled writer.
# Other manual Actions and Pages workflows are unchanged; see docs/circleci.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show CircleCI migration instructions
        run: |
          echo 'Daily course checks now run on CircleCI.'
          echo 'See docs/circleci.md; use run_course_check=true after enabling the two opt-in variables.'
          echo 'This workflow does not crawl courses or write the data branch.'
